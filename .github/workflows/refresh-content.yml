name: Refresh Charades Content

on:
  # Allow manual triggering
  workflow_dispatch:
  # Scheduled daily execution at midnight UTC
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Use the provided token for checkout and push if needed
          token: ${{ github.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv requests

      - name: Generate and Update Content
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # Execute the generation script
          python scripts/generate_categories.py

      - name: Commit and Push Changes
        run: |
          # Configure Git Author
          git config --local user.email "bot@lolcharades.com"
          git config --local user.name "LOL Charades Bot"
          
          # Check for changes
          if [[ -n "$(git status --porcelain category.json metadata.json)" ]]; then
            echo "Changes detected, committing..."
            git add category.json metadata.json
            git commit -m "chore: auto-refresh charades content [$(date +'%Y-%m-%d')]"
            
            # Push changes to main branch
            git push origin main
          else
            echo "No changes detected in content files. Skipping commit."
          fi
        env:
          # Use the content repo token for pushing if configured
          GITHUB_TOKEN: ${{ github.token }}

      - name: Handle Failure
        if: failure()
        run: |
          echo "::error::The content refresh workflow failed. Check logs for details."
